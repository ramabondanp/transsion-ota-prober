[project]
name = "checkota"
version = "0.1.0"
description = "OTA firmware update checker for Transsion Holdings devices (TECNO, Infinix, itel)"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["requests>=2.31", "PyYAML>=6.0", "protobuf>=4.0"]

[project.scripts]
checkota = "checkota.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
license-files = ["LICENSE", "NOTICE"]
packages = [
    "checkota",
    "checkota._vendor",
    "checkota._vendor.checkin",
    "checkota._vendor.proto",
    "checkota._vendor.utils",
    "checkota.bundled_configs",
]
include-package-data = true

[tool.setuptools.package-dir]
"checkota._vendor" = "vendor/google-ota-prober"
"checkota._vendor.checkin" = "vendor/google-ota-prober/checkin"
"checkota._vendor.proto" = "vendor/google-ota-prober/proto"
"checkota._vendor.utils" = "vendor/google-ota-prober/utils"
"checkota.bundled_configs" = "configs"

[tool.setuptools.package-data]
"checkota._vendor" = ["ATTRIBUTION", "VERSION", "proto/*.proto"]
"checkota._vendor.proto" = ["*.proto"]
"checkota.bundled_configs" = ["config-*.yml", "config-*.yaml"]

[tool.ruff]
extend-exclude = ["vendor"]

[tool.pyright]
# `checkin` and `utils` are vendored packages injected onto sys.path at runtime
# by checkota.paths.ensure_vendor_on_path(); teach the type checker about them.
extraPaths = ["vendor/google-ota-prober"]
